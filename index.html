<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070707"><title>Wydad Red Archive</title><meta name="description" content="Independent fan-made cultural and historical Wydad Casablanca archive."><link rel="stylesheet" href="site.css"></head><body>

const sections={
